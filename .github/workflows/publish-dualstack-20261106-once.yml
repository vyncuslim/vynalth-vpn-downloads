name: Publish verified Vynalth VPN Dual-Stack 20261106 beta
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-dualstack-20261106-once.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WIN_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6314-8211-96f2-fc356b6b0ee1/raw?se=2026-11-07T09%3A00%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=0af7a909-4616-5e0e-8445-805a5dd4d2a3&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T01%3A52%3A48Z&ske=2026-11-08T01%3A52%3A48Z&sks=b&skv=2026-02-06&sig=huNmsPBtXZLH1VE1kkWhLGeLa1iX2t6J/z3XtIk4JUM%3D"
      APK_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-d444-8207-b7ed-8fa14f315cb0/raw?se=2026-11-07T09%3A00%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=cd4aadb3-63b5-569d-b4b3-55bc40b9a8e0&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T04%3A37%3A04Z&ske=2026-11-08T04%3A37%3A04Z&sks=b&skv=2026-02-06&sig=o5OQIK2wB0ZFhx55GN8y6hk459JR2AXPsVkpxzv7AV8%3D"
      LINUX_PART1_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-b44c-8207-831d-9d265eba6e61/raw?se=2026-11-07T09%3A00%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=1a84a62e-0030-5855-99a9-7886f76c8187&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A43%3A01Z&ske=2026-11-08T00%3A43%3A01Z&sks=b&skv=2026-02-06&sig=cjAlKgNfGBTaB1uH863FnkhPFuT23xSLEhd7gnbJfOo%3D"
      LINUX_PART2_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-5fa8-8207-af72-edb28e931361/raw?se=2026-11-07T09%3A00%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=61bf594b-acec-5e69-862d-7fed0b401383&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A29%3A24Z&ske=2026-11-08T00%3A29%3A24Z&sks=b&skv=2026-02-06&sig=7IAnuX/29GmMJIvwBJONojJewzWtNgIzgrJrs3orV4k%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download and SHA-256-check source assets
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 420 --output 'Windows-Vynalth-AI-VPN-Setup-1.2.0.exe' "$WIN_URL"
          echo '43c0e57c394d3155320ce1c06dc6182da03fc687764a4678d429f1af64629a4d  Windows-Vynalth-AI-VPN-Setup-1.2.0.exe' | sha256sum --check --status
          test "$(wc -c < 'Windows-Vynalth-AI-VPN-Setup-1.2.0.exe')" -eq 83400381
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 420 --output 'Android-Vynalth-AI-VPN-1.2.3-dual-stack.apk' "$APK_URL"
          echo 'e63f2846a0e6e7a4a6b59f5dd57a593e1a18326e0ae893942db8dc1ea94a62af  Android-Vynalth-AI-VPN-1.2.3-dual-stack.apk' | sha256sum --check --status
          test "$(wc -c < 'Android-Vynalth-AI-VPN-1.2.3-dual-stack.apk')" -eq 15255790
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 420 --output 'linux-gui-1.2.0.part01' "$LINUX_PART1_URL"
          echo 'ae8e56b6baf0e30d679c8e0bbdd66a96e17ebc12fbf2d4fe56d94f81513659ba  linux-gui-1.2.0.part01' | sha256sum --check --status
          test "$(wc -c < 'linux-gui-1.2.0.part01')" -eq 67108864
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 420 --output 'linux-gui-1.2.0.part02' "$LINUX_PART2_URL"
          echo '5c64dcaf9dfc361c678d2c97ba1a71286f5ff235477f116fa99efa5b7d47efb8  linux-gui-1.2.0.part02' | sha256sum --check --status
          test "$(wc -c < 'linux-gui-1.2.0.part02')" -eq 40638401
          cat linux-gui-1.2.0.part01 linux-gui-1.2.0.part02 > Linux-vynalth-vpn-app-1.2.0-x86_64.tar.gz
          echo 'cc1dcf09e1d29ad3f86bd5d1a0639f9edec8d8c7f87e311169e6bb4218b3e40e  Linux-vynalth-vpn-app-1.2.0-x86_64.tar.gz' | sha256sum --check --status
          test "$(wc -c < Linux-vynalth-vpn-app-1.2.0-x86_64.tar.gz)" -eq 107747265
          python3 - <<'PY'
          import tarfile
          name='Linux-vynalth-vpn-app-1.2.0-x86_64.tar.gz'
          with tarfile.open(name) as t:
              members=t.getmembers()
              assert len(members)==76, f'Expected 76 entries, got {len(members)}'
              for m in members:
                  assert m.isfile() or m.isdir(),f'Unexpected archive entry: {m.name}'
                  assert not m.name.startswith('/') and '..' not in m.name.split('/'),f'Unsafe path: {m.name}'
                  assert not (m.mode & 0o022),f'Writable by group/others: {m.name}'
          print('Verified Linux permissions archive')
          PY
      - name: Publish three beta installer assets
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG='v1.2.0-beta-dualstack-20261106'
          gh release view "$TAG" >/dev/null 2>&1 && { echo 'Tag already exists; refusing to overwrite an existing release'; exit 2; }
          gh release create "$TAG" \
            Windows-Vynalth-AI-VPN-Setup-1.2.0.exe \
            Android-Vynalth-AI-VPN-1.2.3-dual-stack.apk \
            Linux-vynalth-vpn-app-1.2.0-x86_64.tar.gz \
            --target "$GITHUB_SHA" --prerelease \
            --title 'Vynalth AI VPN — Dual-Stack Beta (2026-11-06)' \
            --notes 'Beta only: Windows v1.2.0, Android v1.2.3 Dual-Stack, Linux Desktop v1.2.0 permissions-repacked. Linux CLI 6291-byte upload is blocked due known logic defects; use the existing reviewed CLI on the website. SHA-256 manifests are recorded in the repository. Real-device and SG-01 IPv4/IPv6 E2E acceptance remain outstanding. Linux Electron sandbox, Windows Authenticode, and Android update/connection need real-device QA. No stable/production certification.'
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[] | {name,size,digest}]}'
