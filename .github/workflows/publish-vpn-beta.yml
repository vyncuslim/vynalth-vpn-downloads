name: Publish Vynalth VPN Windows and Android beta
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-vpn-beta.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      WIN_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-506c-8211-8d3a-5206a26942ce/raw?se=2026-11-05T15%3A03%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=8c220402-5211-542b-a15f-3b3555f17b5f&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T04%3A05%3A34Z&ske=2026-11-06T04%3A05%3A34Z&sks=b&skv=2026-02-06&sig=C25LCbUHLk%2BcIHNMaLCkgAbX41eGVSsN30UmjRcpyOE%3D"
      APK_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-e714-8206-ab1b-f8b7a9219eb7/raw?se=2026-11-05T15%3A03%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=5b57af51-5f83-51be-8182-4db1e55d718d&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T04%3A05%3A45Z&ske=2026-11-06T04%3A05%3A45Z&sks=b&skv=2026-02-06&sig=eMjvsUGFs/gSNQQGeE0EJ5I4bMYrWNZazAZfr0nrVNc%3D"
    steps:
      - name: Retrieve exactly the expected beta installers
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 360 --output 'Windows-Vynalth-AI-VPN-Setup-1.1.0.exe' "$WIN_URL"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 240 --output 'Android-Vynalth-AI-VPN-1.2.1-security-fix.apk' "$APK_URL"
          echo 'AC75B97C22EC9AD59955BC37E8AF0BA7136AE4E1717C95F70C402903390D58DA  Windows-Vynalth-AI-VPN-Setup-1.1.0.exe' | sha256sum --check --status
          echo '09FD8CE9B4F8146C0D09B23151C70BDE08E69572940A72579A52137BE2D4CD11  Android-Vynalth-AI-VPN-1.2.1-security-fix.apk' | sha256sum --check --status
          test "$(wc -c < 'Windows-Vynalth-AI-VPN-Setup-1.1.0.exe')" -eq 83399896
          test "$(wc -c < 'Android-Vynalth-AI-VPN-1.2.1-security-fix.apk')" -eq 15255790
          printf '%s\n' 'Full file sizes and SHA-256 verified.'
      - name: Publish Windows + Android pre-release assets (never stable)
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG='v1.1.0-beta-20261104'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; adding assets without overwriting.'
            gh release upload "$TAG" 'Windows-Vynalth-AI-VPN-Setup-1.1.0.exe' 'Android-Vynalth-AI-VPN-1.2.1-security-fix.apk'
          else
            gh release create "$TAG" 'Windows-Vynalth-AI-VPN-Setup-1.1.0.exe' 'Android-Vynalth-AI-VPN-1.2.1-security-fix.apk' \
              --target "$GITHUB_SHA" --prerelease --title 'Vynalth AI VPN — Cross-Platform Beta (November 2026)' \
              --notes 'Experimental beta installers for Windows 1.1.0 and Android 1.2.1. Linux Desktop pending packaging/distribution checks. Full real-device and security acceptance is incomplete. Windows installer lacks Authenticode signature. Verify checksums in the repository README before installation.'
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '{tagName, prerelease:.isPrerelease, assets:[.assets[].name]}'
